<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f1f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f0c1d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rovigo Badia">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<title>Trens e ônibus Rovigo e Badia Polesine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f1f7;--surface:#ffffff;--ink:#1d1838;--muted:#6d6888;--line:#e6e3ef;
  --violet:#5a45f2;--tang:#ff8b3d;--lime:#e3ff6e;--deep:#1d1838;--amber:#b25e00;
  --hero:var(--violet);--on:#ffffff;--pill:var(--lime);--pillink:var(--deep);--other:var(--tang);--otheron:#2a1708;
  --f:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f0c1d;--surface:#1a1630;--ink:#f2efff;--muted:#a49ec2;--line:#2b2645;--violet:#6b57ff;--tang:#ff9447;--amber:#ffb547;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f0c1d;--surface:#1a1630;--ink:#f2efff;--muted:#a49ec2;--line:#2b2645;--violet:#6b57ff;--tang:#ff9447;--amber:#ffb547;color-scheme:dark}
body[data-tm="bus"]{--hero:var(--tang);--on:#2a1708;--pill:var(--deep);--pillink:var(--lime);--other:var(--violet);--otheron:#ffffff}

*,*::before,*::after{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--f);-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
main{max-width:520px;margin:0 auto;padding:18px 16px 56px}
button{font-family:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h2{margin:0}
sup{font-size:11px}

/* Topo: relógio, idioma e o trajeto */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}
.clock{display:flex;align-items:baseline;gap:7px;font-size:13px;color:var(--muted);min-width:0}
.clock b{font:700 17px/1 var(--f);color:var(--ink);font-variant-numeric:tabular-nums}
.lang{display:flex;gap:2px;padding:3px;border-radius:99px;background:var(--surface)}
.lang button{font:600 12px/1 var(--f);border:0;background:none;color:var(--muted);padding:7px 11px;border-radius:99px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.route{display:flex;align-items:center;justify-content:space-between;gap:14px}
.stops{position:relative;margin:0;padding-left:28px;display:flex;flex-direction:column;gap:12px;font:700 31px/1 var(--f);font-stretch:88%;letter-spacing:-.03em;min-width:0}
.stops span{position:relative}
.stops::before{content:"";position:absolute;left:6px;top:16px;bottom:16px;border-left:2px dashed var(--hero);opacity:.45}
.stops span::before{content:"";position:absolute;left:-28px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;border:3px solid var(--hero);background:var(--bg);transition:border-color .4s,background-color .4s}
.stops span:last-child::before{background:var(--hero)}
.swap{flex:none;width:48px;height:48px;border-radius:50%;border:0;background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:transform .5s cubic-bezier(.34,1.56,.64,1),background-color .2s}
.swap:hover{background:color-mix(in srgb,var(--hero) 16%,var(--surface))}
.swap.spin{transform:rotate(180deg)}
.swap svg{width:20px;height:20px}

/* Trem ou ônibus */
.mode{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:24px;padding:5px;border-radius:20px;background:var(--surface)}
.mode button{display:flex;align-items:center;justify-content:center;gap:9px;padding:13px 8px;border:0;border-radius:15px;background:none;color:var(--muted);font:600 16px/1 var(--f);cursor:pointer;transition:background-color .35s,color .35s}
.mode button svg{width:20px;height:20px;flex:none}
.mode button[aria-pressed="true"]{background:var(--hero);color:var(--on)}

.warn{margin:14px 0 0;padding:12px 16px;border-radius:18px;background:color-mix(in srgb,var(--amber) 15%,var(--surface));font-size:14px;line-height:1.4}

/* O bilhete: a próxima partida */
.board{position:relative;margin:14px 0 0;padding:22px 22px 20px;border-radius:30px;background:var(--hero);color:var(--on);overflow:hidden;
  box-shadow:0 24px 40px -28px color-mix(in srgb,var(--hero) 90%,#000);transition:background-color .4s,color .4s,box-shadow .4s}
.board:empty{display:none}
.board .to{margin:0;font:600 15px/1.3 var(--f);opacity:.9}
.big{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:12px 0 10px}
.big .t{font:800 clamp(78px,25vw,104px)/.82 var(--f);font-stretch:82%;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-left:-3px}
.big .arr{text-align:right;font:500 14px/1.2 var(--f);opacity:.92;padding-bottom:2px}
.big .arr b{display:block;margin-top:4px;font:700 28px/1 var(--f);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.meta{margin:0;font-size:14px;opacity:.8}
.tear{position:relative;height:0;margin:20px -22px 18px;border-top:2px dashed color-mix(in srgb,var(--on) 30%,transparent)}
.tear::before,.tear::after{content:"";position:absolute;top:-13px;width:24px;height:24px;border-radius:50%;background:var(--bg)}
.tear::before{left:-12px}
.tear::after{right:-12px}
.cd{display:inline-flex;align-items:center;gap:10px;max-width:100%;padding:11px 18px 11px 15px;border-radius:99px;background:var(--pill);color:var(--pillink);font:700 17px/1.15 var(--f);font-variant-numeric:tabular-nums;transition:background-color .4s,color .4s}
.dot{width:9px;height:9px;border-radius:50%;background:currentColor;flex:none;animation:p 1.6s ease-in-out infinite}
@keyframes p{50%{transform:scale(.5);opacity:.35}}
.later{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px;font-size:14px}
.later span{opacity:.8;margin-right:2px}
.later b{padding:7px 12px;border-radius:99px;background:color-mix(in srgb,var(--on) 16%,transparent);font:700 15px/1 var(--f);font-variant-numeric:tabular-nums}
.enr{display:flex;align-items:center;gap:12px;margin-top:16px;font-size:13px;font-variant-numeric:tabular-nums}
.enr span:first-child{opacity:.85}
.bar{position:relative;flex:1;height:4px;border-radius:2px;background:color-mix(in srgb,var(--on) 24%,transparent)}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--on)}
.bar i::after{content:"";position:absolute;right:-7px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:var(--pill);border:2px solid var(--on)}

/* A outra opção de transporte */
.alt{display:grid;grid-template-columns:auto 1fr;align-items:center;column-gap:12px;row-gap:2px;width:100%;margin:12px 0 0;padding:10px 16px 10px 10px;border:0;border-radius:22px;background:var(--surface);font:400 14.5px/1.3 var(--f);text-align:left;cursor:pointer;transition:background-color .2s}
.alt:hover{background:color-mix(in srgb,var(--other) 10%,var(--surface))}
.alt .ai{grid-row:1 / 3;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--other);color:var(--otheron)}
.alt .ai svg{width:19px;height:19px}
.alt .tx{min-width:0}
.alt b{font-weight:700;font-variant-numeric:tabular-nums}
.alt .go{font-weight:600;font-size:13px;line-height:1.2;color:var(--muted)}

/* Dias e grade */
.tabs{display:flex;gap:6px;margin:30px 0 14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap;padding:10px 16px;border:0;border-radius:99px;background:none;color:var(--muted);font:600 15px/1 var(--f);cursor:pointer;transition:background-color .2s,color .2s}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
#ttl{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 4px 12px;font:600 15px/1.3 var(--f)}
.sub{display:inline-block}
.sub::first-letter{text-transform:uppercase}
.chip{display:inline-block;padding:6px 10px;border-radius:99px;background:color-mix(in srgb,var(--hero) 16%,var(--surface));color:var(--ink);font:600 12px/1 var(--f);transition:background-color .4s}
h2.sec{display:flex;align-items:center;gap:10px;margin:28px 4px 10px;font:700 19px/1.2 var(--f);letter-spacing:-.01em}
h2.sec:first-child{margin-top:2px}
.past-t{display:block;width:100%;margin:0 0 8px;padding:11px 12px;border:1.5px dashed var(--line);border-radius:18px;background:none;color:var(--muted);font:600 13.5px/1.2 var(--f);text-align:center;cursor:pointer}
.past-t:hover{color:var(--ink);border-color:var(--muted)}
ul.tt{list-style:none;margin:0;padding:6px;border-radius:24px;background:var(--surface)}
.row{position:relative;display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:8px;padding:11px 8px 11px 12px;border-radius:18px}
.row:not(:first-child)::before{content:"";position:absolute;left:14px;right:14px;top:0;height:1px;background:var(--line)}
.row.next::before,.row.next+.row::before{display:none}
.row .d{min-width:62px;font:700 25px/1 var(--f);font-stretch:85%;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.row .a{min-width:0;color:var(--muted);font-size:13.5px;line-height:1.25;font-variant-numeric:tabular-nums}
.row .a small{display:block;font-size:12.5px;opacity:.85}
.row .n{display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:right}
.row .n em{order:-1;font-style:normal;font-weight:600;font-size:13.5px;color:var(--ink);font-variant-numeric:tabular-nums}
.row .n em:empty{display:none}
.row .n b{font:500 12px/1 var(--f);color:var(--muted)}
.row.past{opacity:.4}
.row.next{background:color-mix(in srgb,var(--hero) 15%,var(--surface))}
.row.next .n em{font-weight:700}
.esc{padding:4px 8px;border-radius:99px;background:color-mix(in srgb,var(--amber) 14%,transparent);color:var(--amber);font:600 11px/1 var(--f)}
.sch .d::after{content:"\2605";margin-left:3px;color:var(--amber);font-size:12px;vertical-align:12px}
.empty{padding:20px 14px;color:var(--muted);text-align:center}

.about{margin:28px 0 0}
.about summary{display:inline-flex;align-items:center;gap:8px;list-style:none;cursor:pointer;padding:10px 16px;border-radius:99px;background:var(--surface);font:600 14px/1 var(--f);color:var(--muted)}
.about summary::-webkit-details-marker{display:none}
.about summary::after{content:"+";font-size:17px;line-height:1}
.about[open] summary::after{content:"\2212"}
.about[open] summary{color:var(--ink)}
/* Favorita, avisos e instalação */
.favc{display:flex;align-items:center;gap:12px;margin:14px 0 0;padding:10px 16px 10px 10px;border-radius:22px;background:color-mix(in srgb,var(--hero) 14%,var(--surface));font-size:14.5px;line-height:1.3;transition:background-color .4s}
.favc .hi{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--hero);color:var(--on)}
.favc .hi svg{width:19px;height:19px;fill:currentColor}
.favc b{font-weight:700;font-variant-numeric:tabular-nums}
.favc small{display:block;font-size:13px;color:var(--muted)}
.act{display:flex;gap:0;margin-right:-4px}
.ib{width:32px;height:32px;padding:0;border:0;border-radius:50%;background:none;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.ib svg{width:18px;height:18px}
.ib:hover{background:color-mix(in srgb,var(--hero) 12%,transparent)}
.ib[aria-pressed="true"]{color:var(--hero)}
.ib[aria-pressed="true"] svg{fill:currentColor}
.ib-ph{width:32px;height:32px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:20;max-width:min(440px,calc(100% - 32px));padding:12px 18px;border-radius:18px;background:var(--ink);color:var(--bg);font:600 14px/1.35 var(--f);box-shadow:0 12px 30px -12px rgb(0 0 0 / .5);transform:translate(-50%,140%);opacity:0;transition:transform .35s cubic-bezier(.34,1.4,.64,1),opacity .25s;pointer-events:none}
.toast.on{transform:translate(-50%,0);opacity:1}
.ios{display:flex;align-items:flex-start;gap:12px;margin:0 0 16px;padding:12px 12px 12px 16px;border-radius:20px;background:var(--surface);font-size:14px;line-height:1.4}
.ios svg{flex:none;width:20px;height:20px;margin-top:1px;color:var(--hero)}
.ios p{margin:0;flex:1}
.ios button{flex:none;border:0;background:none;color:var(--muted);font:600 13px/1 var(--f);padding:6px;cursor:pointer}
.note{max-width:62ch;margin:14px 4px 0;color:var(--muted);font-size:12.5px;line-height:1.6}
.note a{color:var(--ink);font-weight:600;text-underline-offset:3px}

@media (prefers-reduced-motion:reduce){.toast{transition:opacity .2s}.dot{animation:none}.swap,.board,.cd,.mode button,.chip,.stops span::before{transition:none}}
@media (max-width:360px){.stops{font-size:27px}.big .arr b{font-size:24px}.board{padding:20px 18px 18px}.tear{margin-left:-18px;margin-right:-18px}}
</style>
</head>

function romeEpoch(ymd,hm){
  const[y,mo,d]=ymd.split("-").map(Number),[hh,mi]=hm.split(":").map(Number);
  let t=Date.UTC(y,mo-1,d,hh,mi);

document.addEventListener("click",e=>{
  const fv=e.target.closest("[data-fav]"),bl=e.target.closest("[data-bell]"),io=e.target.closest("[data-ios]");
  if(fv){const k=fv.dataset.fav,on=favs.includes(k);favs=on?favs.filter(x=>x!==k):[...favs,k];save2("favs",favs);toast(T(on?"favOff":"favOn"));render();return}
  if(bl){toggleBell(bl.dataset.bell,bl.dataset.bell.split("|")[2]);return}
  if(io){try{localStorage.setItem("iosOk","1")}catch(x){}render();return}
  const s=e.target.closest("#swap"),v=e.target.closest("[data-view]"),g=e.target.closest("[data-lang]"),m=e.target.closest("button[data-mode]"),p=e.target.closest("[data-past]"),al=e.target.closest("[data-alt]");
  if(s){st.dir=st.dir==="ida"?"volta":"ida";st.showPast=false;save("dir",st.dir);s.classList.toggle("spin");render()}
  if(v){st.view=v.dataset.view;render()}
  if(m){st.mode=m.dataset.mode;save("mode",st.mode);render()}
  if(al){st.mode=st.mode==="bus"?"train":"bus";save("mode",st.mode);render();window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"})}
  if(p){st.showPast=!st.showPast;render()}
  if(g){lang=g.dataset.lang;save("lang",lang);render()}
});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)render()});
render();setInterval(tick,1000);
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
